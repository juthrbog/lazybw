version: "3"

vars:
  BINARY: dist/lazybw

tasks:
  build:
    desc: Compile to dist/lazybw
    cmds:
      - mkdir -p dist
      - go build -o {{.BINARY}} .
    sources:
      - "**/*.go"
    generates:
      - "{{.BINARY}}"

  run:
    desc: Run with go run
    cmds:
      - go run .

  test:
    desc: Run all tests
    cmds:
      - go test -race ./...

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run ./...

  tidy:
    desc: Tidy go.mod / go.sum
    cmds:
      - go mod tidy

  fmt:
    desc: Format all Go source files
    cmds:
      - gofmt -l -w .

  release-dry-run:
    desc: Build the release archives locally, with no signature and no SBOMs
    cmds:
      # Signing needs the identity of a tag build, and the SBOMs need syft.
      - goreleaser release --snapshot --clean --skip=sign,sbom

  release:
    desc: "Tag and push a new release (usage: task release -- v0.3.0)"
    preconditions:
      - sh: '[[ "{{.CLI_ARGS}}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]'
        msg: "Give a version such as v0.3.0 or v0.3.0-rc.1: task release -- v0.3.0"
      - sh: test "$(git branch --show-current)" = main
        msg: "Switch to the main branch first."
      - sh: test -z "$(git status --porcelain)"
        msg: "Commit or stash your changes first."
      - sh: git fetch -q origin main && test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
        msg: "Pull first: main is not the same as origin/main."
    cmds:
      - git tag {{.CLI_ARGS}}
      - git push origin {{.CLI_ARGS}}
