name: Release

on:
  push:
    tags:
      - "v*"
  # A change to the release setup runs a snapshot: it builds and checks every
  # archive and the Homebrew formula, but publishes nothing.
  pull_request:
    paths:
      - ".goreleaser.yml"
      - ".github/release.yml"
      - ".github/workflows/release.yml"
      - "scripts/formula.sh"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # No cache in release builds, so a poisoned cache cannot reach them.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # syft writes the SBOMs.
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      # A snapshot publishes nothing. It cannot sign, because keyless signing
      # needs the identity of a tag build.
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.18.3
          args: release --snapshot --clean --skip=sign

      - name: Check the Homebrew formula
        run: |
          scripts/formula.sh "$(jq -r .version dist/metadata.json)" dist/checksums.txt > lazybw.rb
          ruby -c lazybw.rb

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snapshot
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
          retention-days: 7

  # Each archive must run on its platform. --version needs no bw.
  verify:
    needs: snapshot
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux_amd64
            runner: ubuntu-latest
          - platform: linux_arm64
            runner: ubuntu-24.04-arm
          - platform: darwin_arm64
            runner: macos-latest
          - platform: windows_amd64
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: snapshot

      - name: Run lazybw --version
        if: runner.os != 'Windows'
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          tar -xzf lazybw_*_"$PLATFORM".tar.gz lazybw
          ./lazybw --version

      - name: Run lazybw.exe --version
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Expand-Archive -Path (Get-ChildItem lazybw_*_windows_amd64.zip).FullName -DestinationPath .
          .\lazybw.exe --version

  # A tag publishes binaries, so the code must pass the same checks as CI and
  # the vulnerability scan first. This job has no write permission.
  test:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -shuffle=on ./...

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0

      - name: Vulnerability check
        run: govulncheck ./...

  release:
    # A failed check stops the release.
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release and upload assets
      id-token: write # sign with cosign and sign the provenance attestation
      attestations: write # store the provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # cosign signs checksums.txt. syft writes the SBOMs.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.18.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Users can check where an archive came from with
      # "gh attestation verify <archive> --repo juthrbog/lazybw". The
      # checksums cover the archives and the SBOMs.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt

      # The tap gets the new formula through a deploy key of
      # juthrbog/homebrew-tap. Its private key is the HOMEBREW_TAP_SSH_KEY
      # secret of this repository.
      - name: Check the Homebrew setup
        id: tap
        env:
          TAP_SSH_KEY: ${{ secrets.HOMEBREW_TAP_SSH_KEY }}
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'Prerelease: the Homebrew formula stays unchanged.'
          elif [[ -z "$TAP_SSH_KEY" ]]; then
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo '::warning::Homebrew publication skipped. Set the HOMEBREW_TAP_SSH_KEY secret.'
          else
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Write the Homebrew formula
        if: steps.tap.outputs.enabled == 'true'
        run: scripts/formula.sh "${GITHUB_REF_NAME#v}" dist/checksums.txt > lazybw.rb

      - name: Check out the Homebrew tap
        if: steps.tap.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: juthrbog/homebrew-tap
          ref: main
          ssh-key: ${{ secrets.HOMEBREW_TAP_SSH_KEY }}
          path: .homebrew-tap

      - name: Update the Homebrew formula
        if: steps.tap.outputs.enabled == 'true'
        run: |
          mkdir -p .homebrew-tap/Formula
          cp lazybw.rb .homebrew-tap/Formula/lazybw.rb
          git -C .homebrew-tap config user.name 'github-actions[bot]'
          git -C .homebrew-tap config user.email \
            '41898282+github-actions[bot]@users.noreply.github.com'
          git -C .homebrew-tap add Formula/lazybw.rb
          if ! git -C .homebrew-tap diff --cached --quiet; then
            git -C .homebrew-tap commit -m "Update lazybw to $GITHUB_REF_NAME"
            git -C .homebrew-tap push
          fi
